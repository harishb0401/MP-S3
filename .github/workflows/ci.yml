name: Java CI Build & System Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Backend Classes
      run: |
        mkdir -p backend/bin
        javac -d backend/bin $(find backend/src -name "*.java")

    - name: Run Automated System Verification Suite
      run: |
        java -cp backend/bin test.SystemTest
